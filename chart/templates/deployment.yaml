apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}

spec:
  replicas: {{ .Values.replicaCount }}

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app: {{ .Release.Name }}

    spec:
    {{- with .Values.imagePullSecrets }}
    imagePullSecrets:
      {{-toYaml . | nindent 8 }}
    {{- end }}
      containers:
        - name: application

          image: "{{ .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"

          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: APP_ENVIRONMENT
              value: {{ .Values.environment | quote }}

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http

            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http

            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http

            periodSeconds: 10
            failureThreshold: 3

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL