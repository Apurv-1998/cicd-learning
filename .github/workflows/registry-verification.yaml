name: Registry Verification

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  publish-image:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build application
        run: mvn --batch-mode clean verify

      - name: Determine image repository
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "repository=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish test image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true

          tags: |
            ${{ steps.image.outputs.repository }}:registry-test

          build-args: |
            GIT_COMMIT=${{ github.sha }}

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Display published image
        run: |
          echo "Image repository: ${{ steps.image.outputs.repository }}"

          echo "Image digest: ${{ steps.publish.outputs.digest }}"